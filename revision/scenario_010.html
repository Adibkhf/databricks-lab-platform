<script id="content" type="application/json">{"number": 10, "slug": "scenario_010_suppression_du_checkpoint_auto_loader", "category": "replay", "title": {"fr": "Perte de checkpoint et replay Bronze", "en": "Checkpoint loss and Bronze replay"}, "summary": {"fr": "Observer la relecture de six fichiers, puis reconstruire une Silver unique par commande.", "en": "Observe six files replayed, then rebuild Silver with one row per order."}, "problem": {"fr": "La perte de progression fait relire les fichiers ; une écriture append ajoute de nouveau leurs lignes.", "en": "Lost progress causes files to be reread; append writes their rows again."}, "solution": {"fr": "Isoler le test, conserver Bronze traçable, sélectionner une ligne par order_id non NULL dans Silver.", "en": "Isolate the test, retain traceable Bronze, and select one row per non-NULL order_id in Silver."}, "result": {"fr": "README : Bronze 50 008 → 100 016 ; six fichiers inchangés ; Silver finale 50 006 clés, aucun NULL ni doublon.", "en": "README: Bronze 50,008 → 100,016; same six files; final Silver 50,006 keys, no NULLs or duplicates."}, "limits": {"fr": "Le classement utilise l’heure d’ingestion et le chemin, pas une version métier source. Une heure d’arrivée récente ne prouve pas un contenu métier plus récent.", "en": "Ranking uses ingestion time and path, not source business version. Recent arrival does not prove newer business content."}, "branches": [["Isoler la reprise", "Observer la perte sans toucher au pipeline principal", "RAW et checkpoint dédiés", "Six fichiers de référence"], ["Perdre la progression", "Les anciens fichiers deviennent relisibles", "Retirer l’état du test et relancer", "50 008 → 100 016 lignes Bronze"], ["Tracer le replay", "Distinguer nouveaux fichiers et copies", "Comparer lignes et chemins", "Toujours six fichiers"], ["Reconstruire Silver", "Une commande doit rester unique", "ROW_NUMBER par order_id", "50 006 clés retenues"], ["Traiter les clés NULL", "Un NULL peut survivre au classement", "Exclure les clés invalides", "50 007 avant filtre ; 50 006 après"], ["Séparer les garanties", "Progression et unicité sont distinctes", "Checkpoint + règle métier aval", "Ordre d’ingestion ≠ version source"]], "topics": [{"fr": ["Cause du doublement", "Les fichiers n’ont pas changé, mais Bronze double. Quelle preuve chercher ?", "Vérifier la perte du checkpoint et le mode append. Les six sources sont les mêmes ; leurs 50 008 lignes ont été ajoutées une deuxième fois.", "50 008 + 50 008 = 100 016 ; six fichiers."], "en": ["Doubling cause", "Files are unchanged, but Bronze doubles. What evidence do you inspect?", "Check checkpoint loss and append writes. The same six sources had their 50,008 rows added again.", "50,008 + 50,008 = 100,016; six files."]}, {"fr": ["Atomicité et métier", "Pourquoi la table Delta n’empêche-t-elle pas ces doublons ?", "Un append valide peut ajouter les mêmes valeurs. Un commit cohérent ne constitue pas une contrainte d’unicité sur order_id.", "Deux commits append peuvent contenir les mêmes commandes."], "en": ["Atomicity and business", "Why does Delta not prevent these duplicates?", "A valid append can add identical values. A consistent commit is not a uniqueness constraint on order_id.", "Two append commits can contain the same orders."]}, {"fr": ["Surplus de lignes", "Pourquoi le surplus est-il de 50 010 et non 50 008 ?", "Le calcul global inclut le surplus déjà présent dans la baseline. COUNT(DISTINCT) ignore aussi les NULL : inspecter les clés invalides avant de qualifier tout surplus de doublon métier.", "100 016 − 50 006 = 50 010 ; baseline avait déjà un surplus de 2."], "en": ["Excess rows", "Why is row excess 50,010 rather than 50,008?", "The global calculation includes baseline excess. COUNT(DISTINCT) also ignores NULLs: inspect invalid keys before calling every excess row a business duplicate.", "100,016 − 50,006 = 50,010; baseline already had excess 2."]}, {"fr": ["Clé NULL", "Une Silver classée par clé contient une ligne de trop. Où regarder ?", "ROW_NUMBER crée aussi une partition pour les clés NULL, alors que COUNT(DISTINCT order_id) les ignore. Le SQL exclut explicitement les order_id NULL avant le classement.", "50 007 lignes mais 50 006 clés ; après filtre : 50 006."], "en": ["NULL key", "A key-ranked Silver contains one extra row. What do you inspect?", "ROW_NUMBER also creates a NULL-key partition, while COUNT(DISTINCT order_id) ignores NULLs. SQL explicitly excludes NULL keys before ranking.", "50,007 rows but 50,006 keys; after filtering: 50,006."]}, {"fr": ["Choix de version", "Le timestamp d’ingestion suffit-il à choisir la dernière version métier ?", "Non. Le scénario utilise ce classement pour dédupliquer le replay de fichiers. Pour des changements CDC hors ordre, il faudrait une version source et une règle de conflit.", "Un ancien état reçu aujourd’hui a un timestamp récent mais un contenu ancien."], "en": ["Version selection", "Does ingestion timestamp identify the latest business version?", "No. This exercise uses it to deduplicate file replay. Out-of-order CDC changes need source versions and conflict rules.", "An old state arriving today has a recent timestamp but old content."]}, {"fr": ["Checkpoint reconstruit", "Quel contrôle demander au run suivant avec le checkpoint conservé ?", "Vérifier que Bronze ne grossit plus sans nouveau fichier. Le README donne ce contrôle comme attendu après reconstruction ; ne pas le présenter comme une nouvelle mesure de ce portail.", "Attendu : rester à 100 016, pas passer à 150 024."], "en": ["Rebuilt checkpoint", "What should the next run with retained checkpoint verify?", "Check that Bronze does not grow without new files. The README specifies this expected check after reconstruction; this portal does not claim a new measurement.", "Expected: remain at 100,016, not reach 150,024."]}, {"fr": ["Isolation", "Pourquoi préparer un checkpoint et une cible dédiés ?", "La perte de progression change les volumes et peut déclencher un replay complet. L’exercice isole les objets pour rendre l’incident observable sans altérer le flux principal.", "Checkpoint du scénario et table scenario_010 distincts."], "en": ["Isolation", "Why use a dedicated checkpoint and target?", "Progress loss changes volumes and can trigger full replay. Dedicated objects make the incident observable without changing the main flow.", "Scenario checkpoint and scenario_010 table are separate."]}, {"fr": ["Preuve aval", "Quelle preuve montre que Silver est réconciliée ?", "Comparer lignes, clés distinctes, NULL et quelques valeurs. Le résultat documenté est 50 006 lignes pour autant de clés, sans NULL ni doublon.", "Silver : lignes = clés distinctes = 50 006."], "en": ["Downstream proof", "What evidence shows Silver is reconciled?", "Compare rows, distinct keys, NULLs and sampled values. Documented output has 50,006 rows and keys, with no NULLs or duplicates.", "Silver: rows = distinct keys = 50,006."]}], "previous": {"title": {"fr": "Petits fichiers et coût d’ingestion", "en": "Small files and ingestion cost"}}, "next": {"title": {"fr": "CDC INSERT idempotent", "en": "Idempotent INSERT CDC"}}}</script></body></html>
