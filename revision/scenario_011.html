ot every volume.", "12.82 s with 3 INSERTs; 2.41 s with 0."]}, {"fr": ["Transition vers UPDATE", "Quelle évolution est nécessaire pour propager un changement de pays ou de statut ?", "Ajouter une action pour les clés correspondantes, sélectionner une version source et contrôler qu’elle est plus récente que la cible. C’est l’objet du scénario suivant.", "Une clé existante demande WHEN MATCHED UPDATE avec une règle de version."], "en": ["Transition to UPDATE", "What is needed to propagate a country or status change?", "Add a matched-key action, select source versions and verify they are newer than the target. That is the next CDC scenario.", "An existing key needs WHEN MATCHED UPDATE with a version rule."]}], "previous": {"title": {"fr": "Perte de checkpoint et replay Bronze", "en": "Checkpoint loss and Bronze replay"}}, "next": {"title": {"fr": "Propagation d’une mise à jour", "en": "Propagating an update"}}}</script></body></html>
