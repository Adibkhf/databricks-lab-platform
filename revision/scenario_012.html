<script id="content" type="application/json">{"number": 12, "slug": "scenario_012_propagation_d_une_mise_a_jour", "category": "cdc", "title": {"fr": "Propagation d’une mise à jour", "en": "Propagating an update"}, "summary": {"fr": "Faire évoluer le pays de deux clients existants sans modifier le témoin ni réécrire au replay.", "en": "Update the country of two existing customers without changing the control or rewriting on replay."}, "problem": {"fr": "Un MERGE limité aux INSERT ignore les changements sur des clés déjà présentes.", "en": "An INSERT-only MERGE ignores changes to existing keys."}, "solution": {"fr": "Sélectionner la dernière version par client puis appliquer WHEN MATCHED UPDATE avec source > cible.", "en": "Select the latest version per customer, then use WHEN MATCHED UPDATE with source > target."}, "result": {"fr": "Preuve JSON : 4 événements → 3 clés ; 2 UPDATE puis 0 ; 970001 FR→BE v3, 970002 IT→ES v2, témoin inchangé.", "en": "JSON evidence: 4 events → 3 keys; 2 UPDATEs then 0; 970001 FR→BE v3, 970002 IT→ES v2, unchanged control."}, "limits": {"fr": "État courant par client, pas historique SCD2. Le test nominal et le replay ne couvrent pas tous les conflits ou échecs partiels.", "en": "Current customer state, not SCD2 history. Nominal execution and replay do not cover all conflicts or partial failures."}, "branches": [["Identifier le défaut", "La clé existe déjà", "Comparer INSERT seul et UPDATE", "INSERT seul : zéro modification"], ["Choisir la dernière image", "Plusieurs versions concernent un client", "Classer par version décroissante", "4 événements → 3 clés"], ["Comparer à la cible", "Empêcher un retour en arrière", "Version source strictement supérieure", "970001 passe en v3"], ["Mettre à jour le contenu", "Propager le changement réel", "Modifier pays, version et timestamp", "FR→BE ; IT→ES"], ["Préserver le témoin", "Éviter des écritures inutiles", "Ignorer une version égale", "970003 reste FR v1"], ["Prouver le replay", "Les événements peuvent être reçus encore", "Comparer états et compteurs Delta", "2 UPDATE puis zéro"]], "topics": [{"fr": ["INSERT seul", "Un pays change dans Bronze mais Silver reste ancien. Quelle clause inspecter ?", "Vérifier si le MERGE ne traite que les clés absentes. La reproduction INSERT-only ne modifie aucune ligne, car les clients existent déjà.", "970001 existe : WHEN NOT MATCHED ne propage pas son nouveau pays."], "en": ["INSERT only", "Country changes in Bronze but Silver stays old. What clause do you inspect?", "Check whether MERGE only handles missing keys. INSERT-only reproduction modifies nothing because customers already exist.", "970001 exists: WHEN NOT MATCHED does not propagate its new country."]}, {"fr": ["Dernière image", "Pourquoi préparer la source avant un UPDATE ?", "Plusieurs versions peuvent viser la même cible. Garder une image complète récente par client évite de laisser l’ordre du lot décider du résultat.", "4 événements, 3 clés retenues."], "en": ["Latest image", "Why prepare source before UPDATE?", "Several versions can target one row. Keep a recent full image per customer rather than letting batch order decide.", "4 events, 3 selected keys."]}, {"fr": ["Garde de version", "Pourquoi ne pas mettre à jour toutes les clés correspondantes ?", "Une version ancienne pourrait écraser une version récente, et une version égale réécrire inutilement le timestamp. La condition source > cible bloque ces cas.", "970003 v1 face à v1 : témoin inchangé."], "en": ["Version guard", "Why not update all matching keys?", "An old version could overwrite newer state, and an equal version could rewrite the timestamp unnecessarily. Source > target blocks both.", "970003 v1 against v1: unchanged control."]}, {"fr": ["Résultat", "Quelles valeurs concrètes prouvent la propagation ?", "Comparer pays et versions pour chaque clé, pas seulement compter deux UPDATE. La preuve conserve les snapshots avant et après.", "970001 : FR v1 → BE v3 ; 970002 : IT v1 → ES v2."], "en": ["Result", "What concrete values prove propagation?", "Compare country and version per key, not just two UPDATEs. Evidence retains before and after snapshots.", "970001: FR v1 → BE v3; 970002: IT v1 → ES v2."]}, {"fr": ["Replay", "Comment vérifier que le même UPDATE est sans effet au deuxième passage ?", "Rejouer sans reset et vérifier zéro ligne modifiée ainsi que les mêmes snapshots, timestamps inclus.", "Premier passage 2 UPDATE ; replay 0."], "en": ["Replay", "How do you prove the same UPDATE has no effect on replay?", "Replay without reset and verify zero changed rows plus identical snapshots including timestamps.", "First pass 2 UPDATEs; replay 0."]}, {"fr": ["Version et arrivée", "Un événement arrive plus tard avec une version inférieure. Est-il plus récent ?", "Son heure d’arrivée ne change pas la version source. Comparer les versions par clé, indépendamment de l’ordre de réception.", "Cible v3 ; événement reçu ensuite en v2 : ignoré."], "en": ["Version and arrival", "A later arrival has a lower version. Is it newer?", "Arrival time does not change source version. Compare versions per key independently of arrival order.", "Target v3; later received v2: ignored."]}, {"fr": ["Historique", "Cette table permet-elle de retrouver tous les anciens pays ?", "Non. Le MERGE conserve l’état courant. Un historique SCD2 demanderait des lignes de versions et des périodes de validité distinctes.", "FR est remplacé par BE dans l’état courant de 970001."], "en": ["History", "Can this table retrieve every previous country?", "No. MERGE stores current state. SCD2 history would need version rows and validity periods.", "FR is replaced by BE in 970001 current state."]}, {"fr": ["Preuve et limites", "Quelles garanties peux-tu défendre ?", "Deux changements ciblés et un replay stable sont mesurés. Les trois clients forment un jeu contrôlé ; cela ne constitue ni un benchmark ni une preuve de toutes les pannes CDC.", "Témoin identique ; code et résultats liés par empreinte dans la preuve JSON."], "en": ["Evidence and limits", "What guarantees can you defend?", "Two targeted changes and stable replay are measured. Three customers are a controlled dataset, not a benchmark or proof of every CDC failure.", "Identical control; code and results linked by a hash in JSON evidence."]}], "previous": {"title": {"fr": "CDC INSERT idempotent", "en": "Idempotent INSERT CDC"}}, "next": {"title": {"fr": "Propagation d’une suppression", "en": "Propagating a deletion"}}}</script></body></html>
