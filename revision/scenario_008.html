<script id="content" type="application/json">{"number": 8, "slug": "scenario_008_generate_small_files", "category": "performance", "title": {"fr": "Petits fichiers et coût d’ingestion", "en": "Small files and ingestion cost"}, "summary": {"fr": "Comparer 200 petits fichiers à un seul fichier contenant le même nombre de lignes.", "en": "Compare 200 small files with one file containing the same row count."}, "problem": {"fr": "Le coût fixe de découverte, ouverture et traitement se répète pour chaque fichier.", "en": "Discovery, opening and processing overhead is repeated for each file."}, "solution": {"fr": "Comparer deux lectures isolées, avec schéma explicite, checkpoints et tables séparés.", "en": "Compare isolated reads using explicit schema, separate checkpoints and separate tables."}, "result": {"fr": "Mesures du README : 200 lignes dans les deux cas ; 200 fichiers = 27,18 s ; 1 fichier = 8,24 s.", "en": "README measurements: 200 rows in both cases; 200 files = 27.18 s; 1 file = 8.24 s."}, "limits": {"fr": "Gain observé sur ce test, pas un facteur universel. Démarrage, cache et environnement influencent les durées.", "en": "Observed improvement in this test, not a universal factor. Startup, cache and environment affect timings."}, "branches": [["Fixer le volume", "Comparer une même quantité métier", "200 lignes dans chaque test", "200 × 1 ligne contre 1 × 200"], ["Repérer le coût fixe", "Chaque fichier ajoute du travail", "Découverte, ouverture, planification", "Beaucoup de fichiers minuscules"], ["Isoler les lectures", "Éviter un test déjà consommé", "Tables et checkpoints séparés", "Schéma explicite identique"], ["Mesurer les sources", "Ne pas confondre RAW et Delta", "Compter les chemins sources", "200 fichiers RAW contre 1"], ["Comparer les mesures", "Prouver le gain observé", "Même nombre de lignes ingérées", "27,18 s contre 8,24 s"], ["Garder les limites", "Le résultat dépend du contexte", "Répéter dans des conditions comparables", "3,3 fois sur ce test seulement"]], "topics": [{"fr": ["Volume identique", "Pourquoi deux ingestions de 200 lignes peuvent-elles prendre des durées différentes ?", "Le nombre de lignes ne décrit pas le nombre d’ouvertures et de tâches. Beaucoup de fichiers répètent des coûts fixes même si leur contenu total est petit.", "200 fichiers × 1 ligne : 27,18 s ; 1 fichier × 200 : 8,24 s."], "en": ["Same volume", "Why can two 200-row ingestions take different times?", "Row count does not describe file openings or task overhead. Many files repeat fixed costs despite small total content.", "200 one-row files: 27.18 s; one 200-row file: 8.24 s."]}, {"fr": ["Sources et cible", "numFiles dans Delta vaut 1. Cela prouve-t-il qu’un seul fichier RAW a été lu ?", "Non. numFiles décrit les fichiers physiques de la table Delta. Le nombre de sources vient des chemins conservés dans _source_file.", "200 fichiers RAW peuvent produire un autre nombre de fichiers Delta."], "en": ["Source and target", "Delta numFiles equals 1. Does that prove one RAW file was read?", "No. numFiles describes physical Delta table files. Source count comes from paths retained in _source_file.", "200 RAW files can produce a different number of Delta files."]}, {"fr": ["Checkpoint du benchmark", "Un replay paraît instantané. Est-ce une preuve d’optimisation ?", "Pas si le checkpoint a déjà consommé les fichiers. Vérifier que chaque test traite réellement son dataset et conserve 200 lignes de résultat.", "Zéro nouvelle ligne peut expliquer un run rapide."], "en": ["Benchmark checkpoint", "A replay looks instant. Is that evidence of optimization?", "Not if the checkpoint already consumed the files. Verify each test actually processes its dataset and retains 200 result rows.", "Zero new rows can explain a fast run."]}, {"fr": ["Schéma explicite", "Pourquoi le test ne laisse-t-il pas inférer les types ?", "Le code fournit le même schéma pour limiter une différence de travail liée à l’inférence. L’objet de comparaison est surtout la fragmentation en fichiers.", "Même schéma orders dans les deux lecteurs."], "en": ["Explicit schema", "Why avoid type inference in this benchmark?", "Code supplies the same schema to limit work differences from inference. The comparison focuses on file fragmentation.", "Same orders schema in both readers."]}, {"fr": ["Interprétation du gain", "Peut-on annoncer que compacter sera toujours 3,3 fois plus rapide ?", "Non. Ce facteur décrit deux mesures conservées dans le README. Répéter les tests, contrôler démarrage et cache, puis décrire la dispersion avant de généraliser.", "27,18 / 8,24 ≈ 3,3 pour ces runs."], "en": ["Gain interpretation", "Can you claim compaction will always be 3.3 times faster?", "No. That factor describes two README measurements. Repeat tests, control startup and cache, and examine variability before generalizing.", "27.18 / 8.24 ≈ 3.3 for these runs."]}, {"fr": ["Compaction aval", "Optimiser les fichiers Delta supprime-t-il le coût de lecture des petits CSV ?", "Cela agit sur les fichiers de la cible, pas sur les ouvertures des fichiers RAW déjà lus. L’exercice compacte le dataset source pour comparer l’ingestion.", "Optimisation Delta et regroupement RAW sont deux leviers distincts."], "en": ["Downstream compaction", "Does optimizing Delta files remove small CSV reading overhead?", "It changes target files, not openings of RAW files already read. This exercise compacts source data for ingestion comparison.", "Delta optimization and RAW grouping are different controls."]}, {"fr": ["Latence et taille", "Pourquoi ne pas attendre indéfiniment pour fabriquer un fichier énorme ?", "Regrouper les données peut réduire l’overhead, mais attendre augmente la latence de disponibilité. La taille et la fréquence doivent respecter le besoin métier.", "Un fichier toutes les heures peut être trop tard pour un suivi minute par minute."], "en": ["Latency and size", "Why not wait indefinitely to build a huge file?", "Grouping can reduce overhead, but waiting increases availability latency. Size and cadence must fit business needs.", "An hourly file may be too late for minute-level monitoring."]}, {"fr": ["Validation métier", "Comment vérifier que le gain n’a pas été obtenu en perdant des données ?", "Comparer le nombre de lignes et, pour un test renforcé, les clés et valeurs des deux sorties. Le résultat documenté contient 200 lignes dans chaque table.", "Deux sorties de 200 lignes ; conservation des clés à contrôler aussi."], "en": ["Business validation", "How do you check that speed did not come from losing data?", "Compare row counts and, for stronger evidence, keys and values in both outputs. Documented results contain 200 rows in each table.", "Two 200-row outputs; key preservation should also be checked."]}], "previous": {"title": {"fr": "Contrat de fichier et quarantaine", "en": "File contract and quarantine"}}, "next": {"title": {"fr": "Perte de checkpoint et replay Bronze", "en": "Checkpoint loss and Bronze replay"}}}</script></body></html>
