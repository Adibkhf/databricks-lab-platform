<script id="content" type="application/json">{"number": 28, "slug": "scenario_028_transformation_trop_lente", "category": "performance", "title": {"fr": "Transformation lente et backlog", "en": "Slow transformation and backlog"}, "summary": {"fr": "Remplacer une UDF Python ralentie par une expression native équivalente et observer les micro-batches.", "en": "Replace an artificially slowed Python UDF with an equivalent native expression and observe micro-batches."}, "problem": {"fr": "Le traitement reste autour de 380 lignes/s alors que la source produit 500 ; les batches grossissent et durent plus longtemps.", "en": "Processing stays around 380 rows/s against 500 arriving rows/s; batches grow and take longer."}, "solution": {"fr": "Remplacer la transformation avec pause de 10 ms par transaction_id ×2 en expression Spark native.", "en": "Replace the transformation with a 10 ms pause by native Spark transaction_id ×2."}, "result": {"fr": "Trace conservée : avant batches 13,19→52,60 s ; après environ 0,7–1,1 s, avec 2 500 lignes par batch stable.", "en": "Retained trace: before 13.19→52.60 s batches; after roughly 0.7–1.1 s, with 2,500 rows per stable batch."}, "limits": {"fr": "La pause artificielle est retirée en même temps que l’UDF. Le test ne mesure pas l’effet pur Python/native ni tous les coûts d’une cible durable.", "en": "The artificial pause is removed together with the UDF. The test does not isolate Python/native overhead or durable-target costs."}, "branches": [["Repérer le déséquilibre", "La source avance plus vite que le calcul", "Comparer arrivée et traitement", "500/s en entrée ; environ 380/s traités"], ["Suivre l’accumulation", "Le travail en attente grossit", "Observer plusieurs vrais batches", "13,19 → 52,60 s"], ["Identifier le coût", "Pause artificielle à chaque ligne", "Inspecter la transformation Python", "10 ms de pause ; valeur ×2"], ["Garder la logique métier", "Optimiser sans changer les valeurs", "Utiliser une expression Spark native", "transaction_id ×2"], ["Vérifier la cadence", "Terminer avant la prochaine échéance", "Comparer durée et trigger 5 s", "Environ 2 500 lignes ; 0,7–1,1 s"], ["Délimiter le gain", "Plusieurs coûts ont été retirés", "Comparer valeurs et conditions", "Pause + UDF retirées ; sink mémoire"]], "topics": [{"fr": ["Diagnostic", "Pourquoi le backlog augmente-t-il même si le stream ne plante pas ?", "La source ajoute les données plus vite que le traitement les consomme. Les logs montrent environ 500 lignes/s entrantes contre 380 traitées ; la file de travail grossit.", "Batch 1 : 6 721 lignes ; batch 5 : 20 437."], "en": ["Diagnosis", "Why does backlog grow even without crashes?", "Source adds data faster than processing consumes it. Logs show roughly 500 incoming rows/s versus 380 processed, so pending work grows.", "Batch 1: 6,721 rows; batch 5: 20,437."]}, {"fr": ["Trigger", "Un trigger de cinq secondes garantit-il un résultat toutes les cinq secondes ?", "Non. C’est une cadence demandée. Un batch de cinquante secondes ne finit pas en cinq secondes ; mesurer son temps et la fraîcheur réelle.", "Trigger 5 s ; batch lent 52,60 s."], "en": ["Trigger", "Does a five-second trigger guarantee output every five seconds?", "No. It requests a cadence. A fifty-second batch does not finish in five seconds; measure runtime and real freshness.", "5 s trigger; slow batch 52.60 s."]}, {"fr": ["Coût de la transformation", "Pourquoi cette UDF ralentit-elle autant ?", "Elle appelle Python et ajoute volontairement une pause de 10 ms par ligne. La correction retire cette pause et remplace l’opération par une expression native.", "slow_transform fait sleep(0.01), puis value ×2."], "en": ["Transformation cost", "Why is this UDF so slow?", "It calls Python and deliberately sleeps 10 ms per row. The fix removes the pause and uses a native expression.", "slow_transform sleeps 0.01 s, then returns value ×2."]}, {"fr": ["Équivalence", "Que vérifier avant de remplacer l’UDF ?", "Le résultat métier doit être identique pour les valeurs et types concernés. Ici, les deux versions calculent transaction_id ×2 ; vérifier aussi les cas limites si le contrat évolue.", "transaction_id=7 → processed_value=14 dans les deux versions."], "en": ["Equivalence", "What should be checked before replacing the UDF?", "Business outputs must match for relevant values and types. Both versions compute transaction_id ×2 here; inspect edge cases if the contract changes.", "transaction_id=7 → processed_value=14 in both versions."]}, {"fr": ["Régime stable", "D’où viennent les 2 500 lignes dans les batches optimisés ?", "À 500 événements par seconde sur une cadence de cinq secondes, environ 2 500 événements s’accumulent entre déclenchements en régime stable. Le démarrage peut différer.", "500 ×5 = 2 500 ; premiers batches pas forcément identiques."], "en": ["Steady state", "Why do optimized batches contain 2,500 rows?", "At 500 events per second and five-second cadence, roughly 2,500 accumulate between triggers in steady state. Startup can differ.", "500 ×5 = 2,500; early batches may differ."]}, {"fr": ["Facteurs", "Peut-on déduire de ce test que toute UDF est aussi lente ?", "Non. Le code retire en même temps une pause artificielle et l’UDF. Il prouve la correction de cet anti-pattern, pas un ratio universel entre Python et expressions natives.", "Pause de 10 ms retirée : facteur majeur du gain."], "en": ["Factors", "Does this test show every UDF is equally slow?", "No. Code removes an artificial sleep and the UDF together. It proves this anti-pattern fix, not a universal Python/native ratio.", "Removing 10 ms sleep is a major gain factor."]}, {"fr": ["Capacité", "Pourquoi ne pas commencer uniquement par augmenter le cluster ?", "Le code contient un coût évitable pour une opération simple. Corriger puis mesurer permet de dimensionner à partir du travail nécessaire, plutôt que masquer cette pause.", "Multiplier par deux ne nécessite pas une pause par ligne."], "en": ["Capacity", "Why not begin solely by increasing cluster size?", "Code has avoidable cost for a simple operation. Fixing and measuring helps size necessary work rather than masking the pause.", "Doubling a value does not need a sleep per row."]}, {"fr": ["Preuve", "Quelles preuves étayent le retour à une cadence normale ?", "La trace conservée montre des durées inférieures à cinq secondes, un débit de traitement supérieur à l’arrivée et des batches stables. Le sink mémoire ne valide pas une cible de production.", "Après correction : environ 0,7–1,1 s ; 2 500 lignes par batch stable."], "en": ["Evidence", "What demonstrates recovery to normal cadence?", "Retained trace shows durations below five seconds, processing faster than arrival and stable batches. A memory sink does not validate a production target.", "After fix: roughly 0.7–1.1 s; 2,500 rows per steady batch."]}], "previous": {"title": {"fr": "Jointure stream-stream bornée", "en": "Bounded stream-stream join"}}}</script></body></html>
