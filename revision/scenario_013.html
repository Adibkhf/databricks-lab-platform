<script id="content" type="application/json">{"number": 13, "slug": "scenario_013_propagation_d_une_suppression", "category": "cdc", "title": {"fr": "Propagation d’une suppression", "en": "Propagating a deletion"}, "summary": {"fr": "Supprimer un paiement uniquement si le DELETE est plus récent, puis réconcilier Gold et tracer les décisions.", "en": "Delete a payment only if DELETE is newer, then reconcile Gold and audit decisions."}, "problem": {"fr": "Une suppression sans comparaison de version retire aussi le paiement déjà plus récent que son DELETE.", "en": "Deletion without version comparison also removes a payment newer than its DELETE."}, "solution": {"fr": "WHEN MATCHED DELETE avec source > cible ; recalcul Gold ; audit distinct par tentative.", "en": "WHEN MATCHED DELETE with source > target; Gold recomputation; separate attempt audit."}, "result": {"fr": "Preuve JSON : sans garde Gold 30 ; avec garde 1 DELETE, Gold 80 ; replay 0 DELETE. Audit 2 → 4 lignes.", "en": "JSON evidence: unguarded Gold 30; guarded 1 DELETE, Gold 80; replay 0 DELETEs. Audit 2 → 4 rows."}, "limits": {"fr": "La suppression est physique et ne protège pas un futur INSERT ancien. Silver, audit et Gold sont écrits séparément.", "en": "Deletion is physical and does not protect against a future stale INSERT. Silver, audit and Gold are separate writes."}, "branches": [["Reproduire le défaut", "DELETE seul ne garantit pas la fraîcheur", "Tester sans garde", "Deux suppressions ; Gold 30"], ["Comparer les versions", "Protéger un état plus récent", "Source > cible avant DELETE", "980002 v3 garde sa ligne face à DELETE v2"], ["Supprimer la bonne clé", "Appliquer le DELETE récent", "Effacer 980001 v1 avec DELETE v2", "Une suppression réelle"], ["Réconcilier Gold", "Un MERGE ne rafraîchit pas une autre table", "Recalculer depuis Silver", "180 → 80"], ["Rejouer et auditer", "Distinguer état métier et tentatives", "Zéro DELETE ; journaliser les décisions", "Audit 2 → 4 ; métier stable"], ["Voir la limite", "La version disparaît avec la ligne", "Prévoir une mémoire pour un CDC mixte", "Ancien INSERT : risque à traiter ensuite"]], "topics": [{"fr": ["Contrôler la version", "Pourquoi operation = DELETE ne suffit-il pas à autoriser la suppression ?", "L'opération décrit l'intention de la source. Je dois comparer sa version à celle de Silver. Un DELETE v2 sur une cible v3 est ancien : supprimer cette ligne détruirait un état plus récent.", "980001 : DELETE v2 > cible v1 → supprimer.\n980002 : DELETE v2 < cible v3 → conserver."], "en": ["Check the version", "Why is operation = DELETE insufficient to authorize deletion?", "The operation describes the source intent. I must compare its version against Silver. A v2 DELETE against a v3 target is stale: deleting that row would destroy a newer state.", "980001: DELETE v2 > target v1 → delete.\n980002: DELETE v2 < target v3 → keep."]}, {"fr": ["Reproduire le défaut", "Une suppression sans filtre enlève deux paiements. Comment prouver que l'un est supprimé à tort ?", "Je compare les clés et versions aux états initiaux. Le paiement 980002 porte déjà la version 3 alors que le DELETE porte la version 2. Dans ce test, la suppression sans garde laisse seulement le témoin de 30,00, au lieu des deux paiements attendus pour un total de 80,00.", "Sans garde : 2 DELETE, total Gold 30,00.\nAvec garde : 1 DELETE, total Gold 80,00."], "en": ["Reproduce the defect", "An unguarded deletion removes two payments. How do you prove one was deleted incorrectly?", "I compare keys and versions against the initial states. Payment 980002 is already at version 3 while its DELETE is version 2. In this test, unguarded deletion leaves only the 30.00 control payment instead of the expected two payments totaling 80.00.", "Without a guard: 2 DELETEs, Gold total 30.00.\nWith a guard: 1 DELETE, Gold total 80.00."]}, {"fr": ["Réconcilier Gold", "Silver contient les bonnes lignes, mais un dashboard affiche encore 180,00. Où regarder ?", "Je vérifie le recalcul Gold et sa dépendance à Silver. Le MERGE Silver ne rafraîchit pas une autre table par lui-même. Ici, le code agrège à nouveau Silver et vérifie deux paiements pour un total exact de 80,00.", "Avant : 100,00 + 50,00 + 30,00 = 180,00.\nAprès : 50,00 + 30,00 = 80,00."], "en": ["Reconcile Gold", "Silver contains the correct rows, but a dashboard still shows 180.00. Where do you look?", "I check the Gold recomputation and its dependency on Silver. The Silver merge does not refresh another table by itself. Here, the code aggregates Silver again and verifies two payments with an exact total of 80.00.", "Before: 100.00 + 50.00 + 30.00 = 180.00.\nAfter: 50.00 + 30.00 = 80.00."]}, {"fr": ["Rejouer un DELETE", "Le paiement a disparu de Silver. Que doit faire le même DELETE au deuxième passage ?", "La clé ne correspond plus à une ligne cible : aucune suppression n'est appliquée. Ce MERGE n'a pas de clause INSERT. Je vérifie zéro DELETE dans Delta et des snapshots Silver et Gold identiques, sans remise à zéro entre correction et replay.", "delete_001 : DELETED au premier passage.\nMême événement : ALREADY_ABSENT au replay."], "en": ["Replay a DELETE", "The payment is gone from Silver. What should the same DELETE do on its second pass?", "The key no longer matches a target row, so no deletion is applied. This merge has no INSERT clause. I verify zero DELETEs in Delta and identical Silver and Gold snapshots without resetting between the correction and replay.", "delete_001: DELETED on the first pass.\nSame event: ALREADY_ABSENT on replay."]}, {"fr": ["Tracer les décisions", "L'audit gagne deux lignes au replay. Est-ce incompatible avec l'idempotence ?", "Non : l'état métier Silver et les agrégats Gold restent identiques. L'audit journalise chaque tentative, avec un nom de passage. Il contient deux décisions au premier passage et deux au replay. Il ne faut pas présenter l'ensemble des tables comme inchangé.", "Premier passage : DELETED / IGNORED_VERSION.\nReplay : ALREADY_ABSENT / IGNORED_VERSION.\nAudit : 2 puis 4 lignes ; Silver : toujours 2."], "en": ["Trace decisions", "The audit gains two rows on replay. Is that incompatible with idempotence?", "No: Silver business state and Gold aggregates remain identical. The audit logs every attempt using a pass name. It contains two decisions on the first pass and two on replay. The whole set of tables must not be described as unchanged.", "First pass: DELETED / IGNORED_VERSION.\nReplay: ALREADY_ABSENT / IGNORED_VERSION.\nAudit: 2 then 4 rows; Silver: still 2."]}, {"fr": ["Limite du DELETE physique", "Un ancien INSERT pourrait-il recréer le paiement après ce DELETE ?", "Oui, un futur traitement qui insère toute clé absente pourrait le recréer. La suppression physique retire aussi la version de Silver. L'audit trace l'événement, mais le MERGE de ce scénario ne consulte pas cet audit pour bloquer des INSERT. Il faut une mémoire des suppressions ou une règle CDC adaptée pour un flux mixte.", "980001 supprimé à v2.\nAncien INSERT v1 reçu ensuite : risque de réapparition.\nCe cas n'est pas exécuté dans le scénario 013."], "en": ["Physical DELETE limit", "Could an old INSERT recreate the payment after this DELETE?", "Yes, a later process that inserts every absent key could recreate it. Physical deletion also removes the version from Silver. The audit records the event, but this scenario's merge does not consult that audit to block INSERTs. A deletion memory or an appropriate CDC rule is needed for a mixed stream.", "980001 deleted at v2.\nOld INSERT v1 arrives later: reappearance risk.\nThis case is not executed in scenario 013."]}, {"fr": ["Reprise après échec", "Le MERGE Silver réussit, mais Gold échoue. Une seule transaction protège-t-elle l'ensemble ?", "Non. Silver, l'audit et Gold sont écrits séparément dans ce code. Une reprise de production doit identifier les étapes terminées et publier les agrégats cohérents. Le run présenté valide le chemin nominal et le replay ; il ne simule pas cet échec partiel.", "Silver : paiement supprimé.\nGold : ancien total 180,00 tant que le recalcul n'a pas réussi.\nRecalcul attendu : 80,00."], "en": ["Recover after failure", "The Silver merge succeeds, but Gold fails. Does one transaction protect the whole workflow?", "No. Silver, audit and Gold are written separately in this code. Production recovery must identify completed steps and publish consistent aggregates. The presented run validates the nominal path and replay; it does not simulate this partial failure.", "Silver: payment deleted.\nGold: old total 180.00 until recomputation succeeds.\nExpected recomputed total: 80.00."]}, {"fr": ["Preuves et périmètre", "Quelles preuves présenter en entretien sans généraliser les résultats du labo ?", "Je montre les clés restantes, leurs versions et montants, les compteurs Delta, l'audit et la réconciliation Gold. Le paiement v3 et le témoin gardent leur état complet. Les tables ne contiennent que trois paiements : les durées ne prédisent pas le coût à grande échelle.", "Attendu : 980002 v3 pour 50,00 et 980003 v1 pour 30,00.\nMesuré : 1 DELETE puis 0, Gold total 80,00."], "en": ["Evidence and scope", "What evidence can you present in an interview without overgeneralizing lab results?", "I show surviving keys, versions and amounts, Delta metrics, audit and Gold reconciliation. The v3 payment and the control keep their complete state. The tables contain only three payments, so durations do not predict large-scale cost.", "Expected: 980002 v3 for 50.00 and 980003 v1 for 30.00.\nMeasured: 1 DELETE then 0, Gold total 80.00."]}], "previous": {"title": {"fr": "Propagation d’une mise à jour", "en": "Propagating an update"}}, "next": {"title": {"fr": "CDC mixte : conserver un état cohérent", "en": "Mixed CDC: maintain consistent state"}}}</script></body></html>
