<script id="content" type="application/json">{"number": 7, "slug": "scenario_007_file_contract", "category": "ingestion", "title": {"fr": "Contrat de fichier et quarantaine", "en": "File contract and quarantine"}, "summary": {"fr": "Router un CSV lisible mais déposé dans un chemin incorrect vers une quarantaine traçable.", "en": "Route a readable CSV with an invalid source path to a traceable quarantine."}, "problem": {"fr": "Le chemin ingestion_dt remplace ingestion_date ; la découverte Auto Loader accepte pourtant ce nouveau fichier.", "en": "The path uses ingestion_dt instead of ingestion_date; Auto Loader still discovers the new file."}, "solution": {"fr": "Conserver _source_file, contrôler le motif de chemin et séparer Bronze et quarantaine avec un motif de rejet.", "en": "Preserve _source_file, validate its pattern, and split Bronze from quarantine with a rejection reason."}, "result": {"fr": "Validation documentée : fichier invalide absent de orders_raw, présent en quarantaine avec INVALID_SOURCE_PATH.", "en": "Documented validation: invalid file absent from orders_raw and present in quarantine with INVALID_SOURCE_PATH."}, "limits": {"fr": "Le motif contrôle une forme de chemin, pas la validité calendaire de la date ni toute la qualité du CSV. Les deux destinations sont écrites séparément.", "en": "The pattern checks path shape, not calendar validity or all CSV quality. The two destinations are written separately."}, "branches": [["Découvrir le fichier", "Nouveau ne signifie pas conforme", "Auto Loader repère une nouveauté", "CSV lisible, chemin incorrect"], ["Garder la provenance", "Expliquer le rejet et préparer un replay", "Conserver le chemin source", "_source_file"], ["Valider le contrat", "Protéger la Bronze principale", "Contrôler le motif du chemin", "ingestion_date attendu ; ingestion_dt rejeté"], ["Router sans perdre", "Garder les données non conformes", "Séparer valide et invalide", "Bronze ou quarantaine"], ["Documenter le rejet", "Permettre un diagnostic précis", "Ajouter une raison explicite", "INVALID_SOURCE_PATH"], ["Contrôler les limites", "Une regex ne valide pas tout", "Tester contenu et date séparément", "Format correct ≠ date réelle"]], "topics": [{"fr": ["Découverte et contrat", "Pourquoi Auto Loader ingère-t-il un CSV placé au mauvais endroit ?", "Il détecte les fichiers nouveaux sous la racine surveillée. Le contrat de landing doit être contrôlé par le pipeline avant l’écriture Bronze.", "ingestion_dt est découvert mais ne respecte pas ingestion_date."], "en": ["Discovery and contract", "Why does Auto Loader ingest a CSV at the wrong location?", "It discovers new files under the watched root. The pipeline must validate the landing contract before writing Bronze.", "ingestion_dt is discovered but violates ingestion_date."]}, {"fr": ["Provenance", "Comment expliquer précisément le rejet d’une ligne ?", "Conserver le chemin depuis les métadonnées dans _source_file et ajouter _quarantine_reason. L’équipe peut retrouver le fichier et la règle qui a échoué.", "Chemin incorrect + INVALID_SOURCE_PATH."], "en": ["Provenance", "How do you explain a rejection precisely?", "Preserve metadata path in _source_file and add _quarantine_reason. The team can identify the file and failed rule.", "Invalid path + INVALID_SOURCE_PATH."]}, {"fr": ["Routage", "Comment vérifier que la quarantaine ne devient pas une simple copie de Bronze ?", "Chercher le même fichier dans les deux destinations. Pour le fichier invalide testé, aucune ligne dans orders_raw et des lignes en quarantaine sont attendues.", "Fichier invalide : Bronze non ; quarantaine oui."], "en": ["Routing", "How do you verify quarantine is not just a copy of Bronze?", "Look for the same file in both targets. The tested invalid file should have no rows in orders_raw and rows in quarantine.", "Invalid file: Bronze no; quarantine yes."]}, {"fr": ["Regex", "Un chemin avec une date impossible peut-il passer ce contrôle ?", "Oui. Le motif vérifie des chiffres au format AAAA-MM-JJ, pas l’existence de la date. Une validation de calendrier demanderait une règle supplémentaire.", "ingestion_date=2026-99-99 respecte la forme numérique, pas le calendrier."], "en": ["Regex", "Can an impossible date pass this check?", "Yes. The pattern checks digits in YYYY-MM-DD form, not calendar validity. Calendar validation needs another rule.", "ingestion_date=2026-99-99 has the numeric shape, not a valid date."]}, {"fr": ["Qualité", "Un fichier conforme au chemin est-il forcément correct métier ?", "Non. Le contrat de chemin est une condition. Il reste les clés, types, valeurs autorisées et règles de contenu à vérifier.", "orders.csv au bon endroit peut encore contenir un order_id invalide."], "en": ["Quality", "Does a valid path guarantee valid business data?", "No. Path conformity is one condition. Keys, types, allowed values and content rules still need validation.", "orders.csv at the right location can still contain an invalid order_id."]}, {"fr": ["Replay corrigé", "Le fichier rejeté est corrigé. Le déplacer suffit-il à assurer l’unicité ?", "Un nouveau chemin peut être découvert comme un autre fichier. Définir le replay et l’idempotence aval plutôt que supposer que la quarantaine ou le checkpoint déduplique les commandes.", "Même commande dans un chemin corrigé : contrôler sa clé après replay."], "en": ["Corrected replay", "A rejected file is corrected. Does moving it ensure uniqueness?", "A new path can be discovered as another file. Define replay and downstream idempotence instead of assuming quarantine or checkpoint deduplicates orders.", "Same order at a corrected path: verify its key after replay."]}, {"fr": ["Deux écritures", "Une destination réussit et l’autre échoue. Que reste-t-il à garantir ?", "La reprise des deux écritures séparées et l’absence de doublons dans la destination déjà commitée. Le code partagé prévoit des identifiants de transaction ; ce test porte sur le routage.", "Bronze commitée avant une erreur de quarantaine : panne non simulée ici."], "en": ["Two writes", "One destination succeeds and the other fails. What remains to guarantee?", "Recovery of separate writes without duplicates in the committed destination. Shared code has transaction identifiers; this test focuses on routing.", "Bronze commits before a quarantine error: not simulated here."]}, {"fr": ["Preuve", "Quel résultat concret raconter en entretien ?", "Un CSV techniquement valide était accepté avec un mauvais chemin. Après validation du chemin source, le fichier invalide est conservé seulement en quarantaine avec sa raison de rejet.", "Découverte → validation → Bronze ou quarantaine."], "en": ["Evidence", "What concrete result should you present in an interview?", "A technically valid CSV was accepted at an invalid path. After source-path validation, the invalid file is retained only in quarantine with its reason.", "Discovery → validation → Bronze or quarantine."]}], "previous": {"title": {"fr": "Évolution du schéma Auto Loader et Delta", "en": "Auto Loader and Delta schema evolution"}}, "next": {"title": {"fr": "Petits fichiers et coût d’ingestion", "en": "Small files and ingestion cost"}}}</script></body></html>
