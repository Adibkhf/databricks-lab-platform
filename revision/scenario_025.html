<script id="content" type="application/json">{"number": 25, "slug": "scenario_025_etat_qui_augmente_sans_borne", "category": "streaming", "title": {"fr": "État streaming sans borne", "en": "Unbounded streaming state"}, "summary": {"fr": "Observer la croissance des états par client, puis rendre les anciennes fenêtres évictables.", "en": "Observe per-customer state growth, then make old windows evictable."}, "problem": {"fr": "Chaque événement crée une nouvelle clé ; aucune règle ne permet de retirer les états anciens.", "en": "Every event creates a new key; no rule allows old state to be removed."}, "solution": {"fr": "Watermark et fenêtres de 10 s ; cardinalité limitée à 1 000 clients ; débit corrigé à 200 événements/s.", "en": "10-second watermark and windows; cardinality limited to 1,000 customers; corrected rate is 200 events/s."}, "result": {"fr": "README : états non bornés 275→11 986 ; test borné autour de 2 000–3 000 ; 1 000 états retirés au batch 6.", "en": "README: unbounded state 275→11,986; bounded test around 2,000–3,000; 1,000 states removed in batch 6."}, "limits": {"fr": "Le code change aussi le débit 500→200, la cardinalité et les partitions. La comparaison ne mesure pas l’effet isolé du watermark. Sink mémoire synthétique.", "en": "Code also changes rate 500→200, cardinality and partitions. The comparison does not isolate watermark impact. Synthetic memory sink."}, "branches": [["Identifier la croissance", "Une nouvelle clé crée un nouvel état", "Observer cardinalité et rétention", "275 → 11 986 états"], ["Ajouter des fenêtres", "Donner une fin aux agrégats", "Regrouper par client et fenêtre 10 s", "Anciennes fenêtres peuvent se terminer"], ["Définir le watermark", "Encadrer les retards acceptés", "Suivre le temps des événements", "Seuil 10 s ; pas minuterie murale"], ["Prouver l’éviction", "Une mémoire stable ne suffit pas", "Observer les états retirés", "Batch 6 : 1 000 retraits"], ["Contrôler les facteurs", "La correction change plusieurs variables", "500→200/s ; 1 000 clés ; partitions", "Gain non attribuable au seul watermark"], ["Délimiter le labo", "Les données tardives influencent le résultat", "Vérifier règles et pertes possibles", "Sink mémoire ; test synthétique"]], "topics": [{"fr": ["Cause", "Pourquoi un simple groupBy client fait-il grossir l’état ?", "La source non bornée donne une nouvelle clé à chaque événement et le cumul n’a pas de fin temporelle. Spark doit conserver un compteur pour chaque clé.", "customer_id=value ; nouveaux clients permanents."], "en": ["Cause", "Why can groupBy customer keep growing state?", "The unbounded source creates a new key for every event and cumulative aggregation has no time boundary. Spark retains a counter for each key.", "customer_id=value; continually new customers."]}, {"fr": ["Fenêtre", "Ajouter un watermark suffit-il à un compteur global par client ?", "Le plan doit permettre de déterminer quand un état est terminé. Le code corrigé regroupe par fenêtre temporelle et client, avec watermark sur le même temps événement.", "Fenêtre 10 s + client ; anciens agrégats deviennent évictables."], "en": ["Window", "Is a watermark sufficient for a lifetime customer counter?", "The plan must determine when state is complete. Corrected code groups by time window and customer with a watermark on that event time.", "10-second window + customer; old aggregates become evictable."]}, {"fr": ["Temps événement", "Un watermark de dix secondes est-il un délai après l’heure du serveur ?", "Non. Il suit la progression du temps des événements observés. Un stream sans nouveaux événements peut donc ne pas faire avancer son seuil.", "Temps événement le plus récent moins tolérance ; pas horloge murale."], "en": ["Event time", "Is a ten-second watermark a timer from server time?", "No. It follows progress in observed event time. Without new events, the threshold may not advance.", "Latest observed event time minus tolerance, not wall-clock time."]}, {"fr": ["Preuve d’éviction", "Quelle métrique prouve que des états sont réellement supprimés ?", "numRowsRemoved indique des retraits. Le README rapporte 1 000 retraits au batch 6 ; la seule stabilité de memoryUsedBytes serait insuffisante.", "STATE_REMOVED_ROWS=1000, état autour de 2 000–3 000."], "en": ["Eviction proof", "Which metric proves that state is actually removed?", "numRowsRemoved measures removals. README reports 1,000 in batch 6; stable memoryUsedBytes alone would be insufficient.", "STATE_REMOVED_ROWS=1000; state around 2,000–3,000."]}, {"fr": ["Comparaison", "Peut-on attribuer toute l’amélioration au watermark ?", "Non. Le code borné passe aussi de 500 à 200 événements/s, limite les clients à 1 000 et configure huit partitions. Il faudrait tenir ces facteurs constants pour isoler un effet.", "Deux débits différents : comparaison illustrative, pas effet causal unique."], "en": ["Comparison", "Can all improvement be attributed to the watermark?", "No. Bounded code also changes rate from 500 to 200 events/s, limits customers to 1,000 and configures eight partitions. Hold those factors constant to isolate impact.", "Different rates: illustrative comparison, not one isolated causal effect."]}, {"fr": ["Données tardives", "Pourquoi une rétention plus courte peut-elle modifier un résultat métier ?", "Des événements arrivant hors de la tolérance peuvent ne plus être pris en compte. Choisir une politique de retard liée aux données et mesurer les événements exclus.", "Suivre numRowsDroppedByWatermark ; zéro observé ne teste pas tous les retards."], "en": ["Late data", "Why can shorter retention change business results?", "Events arriving outside tolerated lateness may no longer be included. Choose a data-based lateness policy and measure exclusions.", "Track numRowsDroppedByWatermark; zero observed does not test all delays."]}, {"fr": ["État et mémoire", "Pourquoi 2 000 états ne représentent-ils pas une quantité fixe de mémoire ?", "La taille des clés, valeurs et structures compte aussi. Comparer nombre d’états, mémoire et durée des batches plutôt que convertir directement les lignes en octets.", "Même nombre de clés avec des valeurs plus grandes : plus de mémoire possible."], "en": ["State and memory", "Why do 2,000 states not imply a fixed memory size?", "Key, value and structure sizes also matter. Compare state count, memory and batch duration rather than directly converting rows to bytes.", "Same key count with larger values can consume more memory."]}, {"fr": ["Cadence", "Le trigger vaut cinq secondes. Que signifie un batch de vingt-trois secondes ?", "La cadence demandée n’impose pas une limite de calcul. Le stream peut prendre du retard ; vérifier aussi les débits et l’accumulation sur plusieurs batches.", "Batch initial documenté : 23 s pour un trigger de 5 s."], "en": ["Cadence", "Trigger is five seconds. What does a twenty-three-second batch mean?", "Requested cadence does not cap computation time. The stream can fall behind; inspect rates and accumulation across batches too.", "Documented initial batch: 23 s with a 5 s trigger."]}], "previous": {"title": {"fr": "CDC mixte : conserver un état cohérent", "en": "Mixed CDC: maintain consistent state"}}, "next": {"title": {"fr": "Jointure stream-stream bornée", "en": "Bounded stream-stream join"}}}</script></body></html>
