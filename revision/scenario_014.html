<script id="content" type="application/json">{"number": 14, "slug": "scenario_014_insert_update_delete_dans_le_meme_lot", "category": "cdc", "title": {"fr": "CDC mixte : conserver un état cohérent", "en": "Mixed CDC: maintain consistent state"}, "summary": {"fr": "Appliquer INSERT, UPDATE et DELETE avec des doublons et des versions multiples ; empêcher un ancien INSERT de recréer une clé supprimée.", "en": "Apply INSERT, UPDATE and DELETE with duplicates and multiple versions; prevent a stale INSERT from recreating a deleted key."}, "problem": {"fr": "Effacer physiquement 990002 retire sa version v2 ; un ancien INSERT v1 peut la recréer et ajouter 50 à Gold.", "en": "Physically deleting 990002 removes its v2 version; a stale v1 INSERT can recreate it and add 50 to Gold."}, "solution": {"fr": "Conserver la clé, la version et _is_deleted=true ; comparer source > cible ; lire une vue active pour Gold.", "en": "Keep key, version and _is_deleted=true; compare source > target; read an active view for Gold."}, "result": {"fr": "Preuve JSON : 7 événements → 4 clés ; métier 1 INSERT/1 UPDATE/1 DELETE logique ; Gold 180→190. Replay et INSERT ancien : zéro changement.", "en": "JSON evidence: 7 events → 4 keys; business 1 INSERT/1 UPDATE/1 logical DELETE; Gold 180→190. Replay and stale INSERT: zero changes."}, "limits": {"fr": "Lot contrôlé, pas requête streaming. La preuve couvre replay et conflit intra-lot ; Gold est écrite séparément.", "en": "Controlled batch, not a streaming query. Evidence covers replay and intra-batch conflict; Gold is a separate write."}, "branches": [], "topics": [{"fr": ["Normaliser avant le MERGE", "Un lot contient plusieurs versions et un doublon. Pourquoi ne pas le donner directement au MERGE ?", "Plusieurs événements peuvent viser la même ligne cible. Je vérifie d'abord le contrat de source, retire les copies identiques, puis garde la version la plus récente par clé. Ici, les événements sont des images complètes : seule la dernière est nécessaire pour calculer l'état courant. Avec des deltas partiels, cette sélection pourrait perdre des changements.", "7 événements → 6 versions distinctes → 4 clés.\n990001 : UPDATE v2 = 110 ; UPDATE v3 = 120.\nImage retenue : v3 = 120, pas deux écritures successives."], "en": ["Normalize before MERGE", "A batch contains several versions and a duplicate. Why not pass it directly to MERGE?", "Several source events may target the same row. I validate the source contract, remove identical copies, then keep the latest version per key. These events carry full images, so the latest image is sufficient for current state. With partial changes, selecting only the latest event could lose updates.", "7 events → 6 distinct versions → 4 keys.\n990001: UPDATE v2 = 110; UPDATE v3 = 120.\nKeep the v3 image = 120, rather than two successive writes."]}, {"fr": ["Refuser une version ambiguë", "Deux événements ont la même clé et la même version, mais des montants différents. Comment choisir ?", "Je ne choisis pas arbitrairement. Une version métier doit désigner un état unique. La normalisation rejette le lot avec AMBIGUOUS_KEY_VERSION avant le MERGE. Le test vérifie que la version Delta, Silver et Gold ne changent pas. Ce contrôle porte sur le lot reçu ; un conflit avec une version déjà appliquée dans un autre lot n'est pas détecté ici.", "990001 v3 : 120,00 et 121,00 dans le même lot.\nRésultat : rejet avant écriture.\nUne copie identique de 120,00 serait simplement dédupliquée."], "en": ["Reject ambiguous versions", "Two events have the same key and version but different amounts. Which one should win?", "I do not choose arbitrarily. A business version must identify a unique state. Normalization raises AMBIGUOUS_KEY_VERSION before MERGE. The test confirms that the Delta version, Silver and Gold remain unchanged. This validation applies within the incoming batch; it does not detect a conflict against a version already applied from another batch.", "990001 v3: 120.00 and 121.00 in the same batch.\nResult: reject before writing.\nAn identical copy of 120.00 would simply be deduplicated."]}, {"fr": ["Comparer à la cible", "Garder la dernière version du lot suffit-il à empêcher les retours en arrière ?", "Non. La dernière version reçue peut être plus ancienne que celle stockée. La sélection dans le lot et la comparaison à la cible sont deux étapes distinctes. L'appariement utilise transaction_id ; la condition s.sequence_num > t.sequence_num autorise ensuite la modification. sequence_num vient de la source, alors que la version du journal Delta décrit un commit de table.", "Dernière version du lot : v2. Silver : v3.\n2 > 3 est faux → ignorer.\nAu replay : 3 > 3 est faux → conserver aussi _applied_at."], "en": ["Compare against the target", "Is keeping the latest version in the batch enough to prevent rollback?", "No. The latest incoming version may still be older than the stored state. Batch selection and target comparison are separate steps. Matching uses transaction_id; s.sequence_num > t.sequence_num then authorizes an update. sequence_num comes from the source, while a Delta history version identifies a table commit.", "Latest batch version: v2. Silver: v3.\n2 > 3 is false → ignore.\nOn replay: 3 > 3 is false → preserve _applied_at too."]}, {"fr": ["Garder la mémoire d'une suppression", "Un ancien INSERT recrée une transaction supprimée. Quelle cause chercher ?", "La suppression physique a retiré la clé et sa version. Le MERGE considère alors l'INSERT comme une nouvelle clé. La correction garde une ligne marquée _is_deleted = true avec la version de suppression. L'ancien événement trouve cette cible et échoue à la comparaison de version. La vue courante exclut le marqueur. Il conserve seulement l'état courant de la clé, pas toutes ses anciennes versions.", "Suppression physique : DELETE v2, puis INSERT v1 → clé recréée ; Gold = 240.\nSuppression logique : cible supprimée v2 ; 1 > 2 faux → Gold = 190.\nLa purge des marqueurs doit respecter la fenêtre possible de retards et de replays."], "en": ["Remember deleted keys", "An old INSERT recreates a deleted transaction. What cause should you investigate?", "Physical deletion removed both the key and its version. MERGE now treats the INSERT as a new key. The fix retains a row with _is_deleted = true and the deletion version. The old event matches that target and fails the version comparison. The current view excludes the marker. It stores the current key state, not every historical version.", "Physical deletion: DELETE v2, then INSERT v1 → key recreated; Gold = 240.\nLogical deletion: deleted target v2; 1 > 2 false → Gold = 190.\nMarker retention must account for possible delays and replays."]}, {"fr": ["Lire les métriques sans confusion", "Le métier attend un DELETE, mais Delta affiche zéro ligne supprimée. Est-ce un échec ?", "Il faut regarder le mode de suppression. Ici, le DELETE modifie le drapeau et la version d'une ligne : Delta compte un UPDATE. Les métriques physiques indiquent une insertion et deux mises à jour ; la comparaison des états métier indique une création, une modification et une suppression logique. Le nom de l'opération source ne suffit pas à interpréter operationMetrics.", "990001 : montant modifié → UPDATE Delta.\n990002 : _is_deleted devient true → UPDATE Delta.\n990004 : nouvelle ligne → INSERT Delta.\nMétier 1/1/1 ; Delta INSERT 1, UPDATE 2, DELETE physique 0."], "en": ["Interpret metrics correctly", "The business expects a DELETE, but Delta reports zero deleted rows. Did the run fail?", "First check the deletion strategy. Here, DELETE updates a row's flag and version, so Delta counts an UPDATE. Physical metrics show one insertion and two updates; business state comparison shows one creation, one change and one logical deletion. The source operation name alone is insufficient to interpret operationMetrics.", "990001: changed amount → Delta UPDATE.\n990002: _is_deleted becomes true → Delta UPDATE.\n990004: new row → Delta INSERT.\nBusiness 1/1/1; Delta INSERT 1, UPDATE 2, physical DELETE 0."]}, {"fr": ["Prouver le replay et le résultat métier", "Le nombre de transactions actives reste à trois. Comment prouver que le lot a été correctement appliqué ?", "Je compare les clés, montants, versions et timestamps de l'état complet, puis les agrégats de la vue active. Le témoin doit rester identique. Je rejoue le lot sans reset et présente ensuite l'ancien INSERT seul : les deux passages produisent zéro changement de ligne. Gold est réécrite par le code ; l'idempotence vérifiée concerne ses valeurs, pas l'absence de nouveaux commits Gold.", "Avant : 100 + 50 + 30 = 180 ; 3 actives.\nAprès : 120 + 30 + 40 = 190 ; toujours 3 actives.\nReplay et INSERT ancien : mêmes snapshots Silver, mêmes valeurs Gold, métriques MERGE nulles."], "en": ["Prove replay and business results", "The active transaction count remains three. How do you prove that the batch was applied correctly?", "I compare keys, amounts, versions and timestamps across complete state snapshots, then the aggregates from the active view. The control row must remain identical. I replay without resetting and then submit the old INSERT alone: both passes change zero rows. The code rewrites Gold; verified idempotence concerns its values, not the absence of new Gold commits.", "Before: 100 + 50 + 30 = 180; 3 active rows.\nAfter: 120 + 30 + 40 = 190; still 3 active rows.\nReplay and stale INSERT: identical Silver snapshots, identical Gold values, zero MERGE row changes."]}, {"fr": ["Définir le contrat des opérations", "Un UPDATE arrive pour une clé absente, ou un INSERT plus récent pour une clé supprimée. Quel comportement choisir ?", "Le contrat retenu traite INSERT et UPDATE comme des images complètes. Une clé absente est insérée ; une image plus récente remet _is_deleted à false. Un DELETE sans cible crée un marqueur pour bloquer une ancienne image future. Ce sont des choix explicites du code, pas des règles universelles. La réactivation et le DELETE sans cible ne sont pas exercés dans le run de ce scénario.", "Prévu par le code : cible supprimée v2 + image INSERT v3 → réactivation.\nPrévu : clé absente + DELETE v2 → marqueur v2.\nTesté : cible supprimée v2 + INSERT v1 → aucune réactivation."], "en": ["Define operation semantics", "An UPDATE targets a missing key, or a newer INSERT targets a deleted key. What behavior should you choose?", "This contract treats INSERT and UPDATE as full images. A missing key is inserted; a newer image resets _is_deleted to false. A DELETE without a target creates a marker to block older images arriving later. These are explicit code choices, not universal rules. Reactivation and DELETE without a target were not exercised in this scenario's run.", "Code behavior: deleted target v2 + INSERT image v3 → reactivation.\nCode behavior: missing key + DELETE v2 → v2 marker.\nTested: deleted target v2 + INSERT v1 → no reactivation."]}, {"fr": ["Délimiter les garanties", "Silver est correcte, mais Gold reste ancienne après une panne. Le MERGE garantit-il tout le pipeline ?", "Le MERGE est atomique pour la table d'état : contenu, version et drapeau sont écrits ensemble. Le recalcul Gold constitue une autre écriture et peut échouer après le commit Silver. Il faut prévoir une reprise et une réconciliation pour ce cas. Ici, aucun échec partiel ni checkpoint streaming n'est testé : le run traite un lot contrôlé. Les durées sur quatre clés ne prouvent pas une amélioration à grande échelle.", "Panne hypothétique : Silver = état corrigé ; Gold = 180 au lieu de 190.\nRéconciliation attendue : relire la vue active et recalculer Gold.\nRun réel : succès nominal, replay, ancien INSERT et conflit intra-lot ; pas de readStream/foreachBatch."], "en": ["State the guarantees precisely", "Silver is correct but Gold remains stale after a failure. Does MERGE guarantee the whole pipeline?", "MERGE is atomic for the state table: payload, version and deletion flag are written together. Gold recomputation is a separate write and can fail after Silver commits. Recovery and reconciliation must handle that case. This run tests neither partial failures nor streaming checkpoints: it processes a controlled batch. Timings on four keys do not establish large-scale performance gains.", "Hypothetical failure: Silver = corrected state; Gold = 180 instead of 190.\nExpected reconciliation: reread the active view and rebuild Gold.\nActual run: nominal success, replay, stale INSERT and intra-batch conflict; no readStream/foreachBatch."]}], "previous": {"title": {"fr": "Propagation d’une suppression", "en": "Propagating a deletion"}}, "next": {"title": {"fr": "État streaming sans borne", "en": "Unbounded streaming state"}}}</script></body></html>
