<script id="content" type="application/json">{"number": 26, "slug": "scenario_026_jointure_sans_contrainte_temporelle", "category": "streaming", "title": {"fr": "Jointure stream-stream bornée", "en": "Bounded stream-stream join"}, "summary": {"fr": "Associer commandes et paiements sans conserver indéfiniment les lignes qui pourraient encore matcher.", "en": "Join orders and payments without indefinitely retaining rows that might still match."}, "problem": {"fr": "La jointure par clé seule ne permet pas de savoir qu’un match futur est devenu impossible.", "en": "A key-only join cannot determine when a future match becomes impossible."}, "solution": {"fr": "Watermarks de 10 s sur les deux entrées et paiement compris entre commande et commande +10 s.", "en": "10-second watermarks on both inputs and payment time between order time and order time +10 s."}, "result": {"fr": "README : sans borne 179→5 619 états ; avec borne environ 3 552 ; batch 7 ajoute et retire 850 ; 2 247 matches dans [0,10] s.", "en": "README: unbounded 179→5,619 states; bounded around 3,552; batch 7 adds and removes 850; 2,247 matches within [0,10] s."}, "limits": {"fr": "Jointure inner sur sources rate 100 et 70 événements/s, avec sink mémoire. Les non-matches et la reprise d’un sink de production ne sont pas validés.", "en": "Inner join on rate sources of 100 and 70 events/s with a memory sink. Unmatched rows and production sink recovery are not validated."}, "branches": [["Observer l’attente", "Une clé peut matcher dans le futur", "Jointure sur clé seulement", "179 → 5 619 états"], ["Définir la règle métier", "Tous les paiements ne sont pas admissibles", "Délai paiement-commande entre 0 et 10 s", "Un paiement à +11 s ne matche pas"], ["Poser les watermarks", "Savoir quand un match est trop tardif", "Suivre les temps des deux streams", "Tolérance 10 s par entrée"], ["Prouver l’éviction", "Libérer les lignes devenues inutiles", "Mesurer entrants et retraits", "850 mis à jour ; 850 retirés"], ["Valider les matches", "Un état stable ne prouve pas la justesse", "Contrôler délais et lignes jointes", "2 247 matches ; délai 0 à 10 s"], ["Délimiter le test", "Inner join ne publie pas les absences", "Tester retards et reprises séparément", "Sources synthétiques ; sink mémoire"]], "topics": [{"fr": ["Attente sans fin", "Pourquoi la jointure sur order_id seul garde-t-elle des lignes anciennes ?", "Sans borne, un paiement correspondant peut théoriquement arriver plus tard. Spark ne peut pas considérer la ligne comme définitivement inutilisable.", "Sans borne : 179 → 5 619 états dans le README."], "en": ["Endless waiting", "Why does an order_id-only join retain old rows?", "Without a bound, a matching payment can theoretically arrive later. Spark cannot classify the row as permanently unusable.", "Unbounded: 179 → 5,619 states in README."]}, {"fr": ["Borne métier", "À quoi sert payment_time ≤ order_time +10 s ?", "Elle définit les matches admissibles et permet de raisonner sur la fin d’attente. Cette règle change aussi le résultat métier ; elle doit être justifiée.", "Paiement à +8 s admissible ; +11 s hors règle."], "en": ["Business bound", "What does payment_time ≤ order_time +10 s achieve?", "It defines valid matches and enables reasoning about when waiting ends. It also changes business results, so it needs justification.", "Payment at +8 s valid; +11 s outside the rule."]}, {"fr": ["Watermark et borne", "Pourquoi distinguer la tolérance de retard et la plage de jointure ?", "La plage compare les temps métier de deux événements. Le watermark décrit la progression et le retard toléré à l’arrivée. Deux paramètres de dix secondes peuvent donc avoir des rôles différents.", "Paiement tardivement reçu avec délai métier +5 s : notions distinctes."], "en": ["Watermark and bound", "Why distinguish lateness tolerance from join range?", "The range compares business event times. Watermark tracks progress and tolerated arrival lateness. Two ten-second settings can have different roles.", "Late-arriving payment with business delay +5 s: different concepts."]}, {"fr": ["Équilibre", "Quel signal montre que l’état se stabilise ?", "Observer les états totaux et retirés sur plusieurs batches. Le batch 7 documenté met à jour et retire chacun 850 états, avec un total autour de 3 552.", "Entrées et évictions se compensent dans ce batch."], "en": ["Balance", "What indicates stabilized state?", "Inspect total and removed state across batches. Documented batch 7 updates and removes 850 states each, around 3,552 total.", "Updates and evictions balance in that batch."]}, {"fr": ["Justesse", "L’état est stable. Comment vérifier que les jointures restent correctes ?", "Contrôler les clés et les différences payment_time-order_time. Le test valide 2 247 matches avec un délai entre zéro et dix secondes.", "min_delay=0 ; max_delay=10 ; PASS."], "en": ["Correctness", "State is stable. How do you check join correctness?", "Inspect keys and payment_time-order_time differences. The test validates 2,247 matches with delays from zero to ten seconds.", "min_delay=0; max_delay=10; PASS."]}, {"fr": ["Stream lent", "Si les paiements cessent d’arriver, l’état peut-il encore augmenter ?", "Oui. La progression temporelle du stream lent peut retarder l’éviction. Examiner les watermarks des deux entrées et la politique globale ; ne pas conclure à une fuite mémoire uniquement.", "Commandes continuent ; watermark paiement reste en arrière."], "en": ["Slow stream", "If payments stop arriving, can state grow again?", "Yes. Slow input event-time progress can delay eviction. Inspect both watermarks and global policy instead of immediately diagnosing a memory leak.", "Orders continue; payment watermark lags."]}, {"fr": ["Non-match", "Une commande sans paiement apparaît-elle avec un NULL dans cette sortie ?", "Non, le code utilise inner join. Il produit les correspondances admissibles, pas une liste des commandes impayées. Un autre besoin demanderait une autre jointure et des tests.", "Commande sans match : absente de la sortie inner."], "en": ["Unmatched rows", "Does an order without payment appear with NULL here?", "No. Code uses inner join. It returns valid matches, not a list of unpaid orders. Another requirement needs another join and tests.", "Order without a match: absent from inner output."]}, {"fr": ["Sink de test", "Le sink mémoire prouve-t-il une reprise de production ?", "Non. Il sert à observer les résultats et les métriques dans le labo. Une cible durable, ses écritures et ses retries demanderaient une validation distincte.", "memory + queryName : inspection du test, pas garantie de livraison durable."], "en": ["Test sink", "Does a memory sink prove production recovery?", "No. It supports lab inspection of results and metrics. A durable target and its writes and retries need separate validation.", "memory + queryName: test inspection, not durable delivery guarantees."]}], "previous": {"title": {"fr": "État streaming sans borne", "en": "Unbounded streaming state"}}, "next": {"title": {"fr": "Transformation lente et backlog", "en": "Slow transformation and backlog"}}}</script></body></html>
