<script id="content" type="application/json">{"number": 6, "slug": "scenario_006_schema_evolution", "category": "ingestion", "title": {"fr": "Évolution du schéma Auto Loader et Delta", "en": "Auto Loader and Delta schema evolution"}, "summary": {"fr": "Accepter la nouvelle colonne channel dans le lecteur et dans les deux destinations Delta.", "en": "Accept the new channel column in the reader and both Delta destinations."}, "problem": {"fr": "Auto Loader détecte une colonne inconnue ; un schéma lecteur évolué ne suffit pas à mettre à jour les tables cibles.", "en": "Auto Loader detects an unknown column; an evolved reader schema does not by itself update target tables."}, "solution": {"fr": "addNewColumns et schemaHints côté lecteur ; mergeSchema pour Bronze et quarantaine ; identifiants de transaction pour les retries.", "en": "Reader addNewColumns and schemaHints; mergeSchema on Bronze and quarantine; transaction identifiers for retries."}, "result": {"fr": "Incident et correction documentés : channel STRING apparaît dans le schéma Auto Loader et est prévu dans les deux écritures Delta.", "en": "Documented incident and fix: channel STRING appears in the Auto Loader schema and is handled by both Delta writes."}, "limits": {"fr": "Les options de retry sont présentes dans le code partagé. Aucun résultat de simulation d’échec entre les deux écritures n’est conservé dans ce dossier.", "en": "Retry options are in shared code. This folder does not retain results from a failure injected between the two writes."}, "branches": [["Détecter la nouveauté", "Le fichier ajoute une colonne", "Observer l’exception et le schéma", "channel STRING"], ["Faire évoluer le lecteur", "Comprendre la structure source", "addNewColumns + schemaHints", "Schéma enregistré dans schemaLocation"], ["Faire évoluer Delta", "La table peut avoir un ancien schéma", "mergeSchema sur les écritures", "Bronze et quarantaine acceptent channel"], ["Séparer les destinations", "Deux commits peuvent réussir différemment", "Inspecter chaque table", "Bronze OK ; quarantaine en erreur : possible"], ["Préparer le retry", "Éviter de réécrire un batch déjà commité", "txnAppId par destination + batch_id", "Même transaction reconnue"], ["Vérifier le périmètre", "Présence de code ≠ panne testée", "Contrôler schémas et résultats", "Échec partiel à tester séparément"]], "topics": [{"fr": ["Deux schémas", "Auto Loader connaît channel mais l’écriture Delta échoue. Où chercher ?", "Vérifier le schéma de la cible. Le schéma découvert par le lecteur et celui d’une table Delta évoluent séparément ; mergeSchema est activé sur les deux écritures.", "Lecteur : channel STRING ; cible ancienne : channel absente."], "en": ["Two schemas", "Auto Loader knows channel but the Delta write fails. Where do you look?", "Inspect the target schema. Reader discovery and Delta table evolution are separate; mergeSchema is enabled on both writes.", "Reader: channel STRING; old target: no channel."]}, {"fr": ["Évolution contrôlée", "Une nouvelle colonne fait arrêter le lecteur. Faut-il supprimer le checkpoint ?", "Non. Identifier la nouvelle colonne, vérifier le schéma enregistré et reprendre avec une configuration compatible. Supprimer la progression serait un autre changement avec un risque de replay.", "channel arrive ; le dossier de schéma conserve sa nouvelle définition."], "en": ["Controlled evolution", "A new column stops the reader. Should you delete its checkpoint?", "No. Identify the column, inspect recorded schema, then resume with compatible settings. Removing progress is a separate change with replay risk.", "channel arrives; schema storage retains its new definition."]}, {"fr": ["Types", "Que prouve schemaHints sur channel ?", "Il exprime le type attendu lors de la lecture. Cela ne valide pas les valeurs métier ni toutes les futures évolutions de type.", "channel STRING accepte mobile ; la liste des canaux autorisés est une autre règle."], "en": ["Types", "What does schemaHints on channel prove?", "It specifies the expected reading type. It does not validate business values or every future type change.", "channel STRING can hold mobile; allowed channel values are another rule."]}, {"fr": ["Quarantaine", "Pourquoi faire évoluer aussi la table de quarantaine ?", "Une ligne rejetée doit conserver le contenu reçu pour le diagnostic. Si seule Bronze évolue, la seconde écriture peut échouer à cause de la même nouvelle colonne.", "Fichier rejeté avec channel : conserver aussi channel en quarantaine."], "en": ["Quarantine", "Why evolve the quarantine table too?", "Rejected rows should retain incoming content for diagnosis. Evolving only Bronze can leave the second write failing on the same new column.", "Rejected file with channel: preserve channel in quarantine too."]}, {"fr": ["Échec partiel", "Bronze est commitée et la quarantaine échoue. Le batch est-il atomique ?", "Non. foreachBatch effectue deux écritures distinctes. Il faut reprendre sans dupliquer la destination déjà écrite et terminer celle qui manque.", "Bronze OK ; quarantaine KO : scénario de panne non exercé ici."], "en": ["Partial failure", "Bronze commits and quarantine fails. Is the batch atomic?", "No. foreachBatch performs separate writes. Recovery must avoid duplicating the completed destination and finish the missing one.", "Bronze OK; quarantine failed: failure scenario not exercised here."]}, {"fr": ["Retry", "Comment le code reconnaît-il une écriture déjà appliquée ?", "Il associe un txnAppId stable à chaque destination et utilise batch_id comme txnVersion. Cela identifie une transaction déjà écrite ; ce n’est pas une déduplication par clé métier.", "Même destination, même application, même batch : transaction déjà connue."], "en": ["Retry", "How does code recognize an already applied write?", "It assigns a stable txnAppId per destination and uses batch_id as txnVersion. That identifies a previous transaction, not business-key duplicates.", "Same destination, application and batch: known transaction."]}, {"fr": ["Nouvelle progression", "Pourquoi un nouveau checkpoint impose-t-il de revoir les identifiants de transaction ?", "Les batch IDs peuvent repartir de zéro. Réutiliser l’ancienne application avec ces versions peut faire ignorer des écritures considérées comme déjà appliquées. Définir la stratégie de reprise avant de réinitialiser.", "Ancienne application a écrit batch 0 ; nouvelle progression repart à 0."], "en": ["New progress", "Why review transaction identifiers when using a new checkpoint?", "Batch IDs can restart at zero. Reusing the old application with those versions can skip writes considered already applied. Define recovery before resetting progress.", "Old application wrote batch 0; new progress starts at 0."]}, {"fr": ["Validation", "Quelles preuves présenter sans promettre une reprise globale ?", "Montrer le nouveau schéma, channel dans les deux destinations et les options du code. Distinguer la correction documentée d’un test de panne multi-table non conservé.", "Vérifier channel dans Bronze ET quarantaine, pas seulement printSchema."], "en": ["Validation", "What evidence can you present without claiming global recovery?", "Show updated schema, channel in both targets and code options. Distinguish the documented fix from an unrecorded multi-table failure test.", "Check channel in Bronze AND quarantine, not just printSchema."]}], "previous": {"title": {"fr": "Auto Loader : ingestion incrémentale", "en": "Auto Loader: incremental ingestion"}}, "next": {"title": {"fr": "Contrat de fichier et quarantaine", "en": "File contract and quarantine"}}}</script></body></html>
