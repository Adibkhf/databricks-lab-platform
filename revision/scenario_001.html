<script id="content" type="application/json">{"number": 1, "slug": "scenario_001_auto_loader_incremental", "category": "ingestion", "title": {"fr": "Auto Loader : ingestion incrémentale", "en": "Auto Loader: incremental ingestion"}, "summary": {"fr": "Ajouter deux commandes dans un nouveau fichier et vérifier que les anciens fichiers ne sont pas relus.", "en": "Add two orders in a new file and verify that older files are not ingested again."}, "problem": {"fr": "Une relance pourrait dupliquer les anciennes données si la progression des fichiers était perdue.", "en": "A restart could duplicate older data if file progress were lost."}, "solution": {"fr": "Conserver le checkpoint Auto Loader et contrôler les fichiers réellement ingérés.", "en": "Keep the Auto Loader checkpoint and inspect the files actually ingested."}, "result": {"fr": "Résultat documenté : Bronze 50 003 → 50 005 lignes ; 3 → 4 fichiers ; nouveau fichier = 2 lignes.", "en": "Documented result: Bronze 50,003 → 50,005 rows; 3 → 4 files; new file = 2 rows."}, "limits": {"fr": "Le test prouve la progression par fichier. Il ne prouve pas la déduplication de clés métier contenues dans des fichiers différents.", "en": "The test proves file-level progress, not business-key deduplication across different files."}, "branches": [["Établir la baseline", "Savoir ce qui existe avant", "Compter lignes et fichiers", "50 003 lignes ; 3 fichiers"], ["Ajouter un fichier", "Tester uniquement une nouveauté", "Déposer batch_004 avec deux commandes", "2 nouvelles lignes"], ["Conserver le checkpoint", "Mémoriser les fichiers traités", "Reprendre le même état de progression", "Anciens fichiers non relus"], ["Tracer la source", "Prouver quelles lignes sont nouvelles", "Contrôler le chemin du fichier", "3 → 4 fichiers sources"], ["Vérifier la différence", "Éviter un résultat trompeur", "Comparer avant et après", "50 003 + 2 = 50 005"], ["Délimiter la garantie", "Un nouveau fichier peut répéter une commande", "Séparer progression et unicité métier", "Checkpoint ≠ déduplication métier"]], "topics": [{"fr": ["Écart attendu", "Après un dépôt de deux commandes, comment détecter une relecture involontaire ?", "Comparer la baseline et le résultat : seules deux lignes doivent être ajoutées. Vérifier leur fichier source et les fichiers connus par le checkpoint.", "50 003 → 50 005 ; batch_004 contient 2 lignes."], "en": ["Expected difference", "How do you detect unintended replay after adding two orders?", "Compare baseline and output: only two rows should be added. Check their source file and the files tracked by the checkpoint.", "50,003 → 50,005; batch_004 contains 2 rows."]}, {"fr": ["Progression", "Pourquoi le même chemin de checkpoint doit-il être conservé entre les runs ?", "Il conserve la progression de cette query. Un autre checkpoint démarre avec un autre état et peut considérer les fichiers existants comme non traités.", "Même source + état conservé → seules les nouveautés sont traitées."], "en": ["Progress", "Why keep the same checkpoint path between runs?", "It retains this query’s progress. A different checkpoint starts with different state and can consider existing files unprocessed.", "Same source + retained state → only new files are processed."]}, {"fr": ["Preuve par fichier", "Le nombre de lignes semble correct. Quelle autre preuve demander ?", "Vérifier les chemins sources et cloud_files_state. Le comptage seul ne montre pas si des anciennes lignes ont été remplacées ou relues.", "Quatre fichiers connus, dont le nouveau fichier de deux lignes."], "en": ["File evidence", "Row count looks correct. What other evidence do you request?", "Inspect source paths and cloud_files_state. A count alone does not identify the files read.", "Four tracked files, including the new two-row file."]}, {"fr": ["Clé métier", "Une commande déjà connue arrive dans un nouveau fichier. Le checkpoint la bloque-t-il ?", "Non, la nouveauté du fichier ne dit pas si sa commande existe déjà. Il faut une règle métier aval, par exemple un MERGE sur une clé stable.", "Deux fichiers différents contiennent order_id=900001 : cas non testé ici."], "en": ["Business key", "An existing order arrives in a new file. Does the checkpoint block it?", "No. A new file does not imply a new order. Downstream business logic such as MERGE on a stable key is needed.", "Two different files contain order_id=900001: not tested here."]}, {"fr": ["Fin du run", "Le pipeline termine après avoir lu les fichiers. Est-ce forcément un échec du streaming ?", "Le lecteur partagé utilise AvailableNow : traiter les données disponibles puis terminer est le comportement attendu. Vérifier le statut et les nouveaux fichiers, pas seulement l’arrêt.", "Un run terminé avec les deux nouvelles commandes est attendu."], "en": ["Run completion", "The pipeline stops after reading the files. Is that necessarily a streaming failure?", "The shared reader uses AvailableNow: processing available data and then stopping is expected. Inspect status and new files, not just termination.", "A completed run containing the two new orders is expected."]}, {"fr": ["Schéma et progression", "Peut-on utiliser le dossier de schéma comme checkpoint ?", "Ce sont deux responsabilités : le schéma décrit les colonnes, le checkpoint garde la progression. Le code définit deux emplacements séparés.", "Nouvelle colonne : schéma ; fichier déjà traité : progression."], "en": ["Schema and progress", "Can the schema directory replace the checkpoint?", "They have different responsibilities: schema describes columns, checkpoint tracks progress. The code uses separate locations.", "New column: schema; previously processed file: progress."]}, {"fr": ["Traçabilité", "Une équipe affirme que les quatre fichiers ont été réingérés. Comment vérifier ?", "Comparer les lignes par fichier et les états de découverte. Dans le README, les anciens fichiers restent présents sans nouvelle ingestion, tandis que le quatrième ajoute deux lignes.", "Présence dans l’état du checkpoint ≠ relecture dans ce run."], "en": ["Traceability", "A team claims all four files were ingested again. How do you check?", "Compare rows by source file and discovery state. The README reports older files retained without new ingestion and two rows from the fourth file.", "Presence in checkpoint state does not mean replay in this run."]}, {"fr": ["Limites", "Que peux-tu affirmer à partir de cet exercice ?", "L’ingestion incrémentale fonctionne sur les fichiers testés avec cet état conservé. Une panne partielle, un fichier modifié ou des doublons métier demanderaient des tests distincts.", "Prouvé : +2 lignes. Non prouvé : toutes les stratégies de reprise."], "en": ["Limits", "What can you claim from this exercise?", "Incremental ingestion works for the tested files with retained state. Partial failure, file changes and business duplicates require separate tests.", "Proven: +2 rows. Not proven: every recovery strategy."]}], "next": {"title": {"fr": "Évolution du schéma Auto Loader et Delta", "en": "Auto Loader and Delta schema evolution"}}}</script></body></html>
