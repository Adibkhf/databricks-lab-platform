name: CI

# Lance le CI sur les changements de main et les Pull Requests.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Permissions minimales nécessaires au workflow.
permissions:
  contents: read

jobs:
  unit-tests:
    name: PySpark unit tests
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Spark 4.x nécessite Java 17 ou supérieur.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Utilise la même version Python principale que ton environnement local.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Installe uniquement ce qui est nécessaire aux tests actuels.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyspark==4.2.0

      # Exécute les tests unitaires.
      - name: Run PySpark tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m pytest -q tests/