name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: PySpark unit tests
    runs-on: ubuntu-latest

    steps:
      # Récupère le repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Spark nécessite une JVM.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Installe Python pour PySpark/PyTest.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Installe les dépendances nécessaires aux tests.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyspark==4.2.0

      # Lance les tests unitaires PySpark.
      - name: Run PySpark tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m pytest -q tests/